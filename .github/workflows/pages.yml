# Publishes the site/ folder to GitHub Pages on every push to main, with the chapters compiled to a PDF.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The "Read as PDF" button: the chapters compiled with LaTeX (thesis/build.py).
      # If any of this fails, the site still publishes; the button then shows the printable web version.
      - uses: actions/cache/restore@v4
        id: tex
        with:
          path: ~/.TinyTeX
          key: tinytex-v2-${{ hashFiles('thesis/texlive-packages.txt') }}
      - name: Install LaTeX (TinyTeX)
        if: steps.tex.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          TLMGR=$(echo ~/.TinyTeX/bin/*/tlmgr)
          $TLMGR update --self          # a fresh TinyTeX won't install packages until tlmgr is current
          $TLMGR install $(cat thesis/texlive-packages.txt)
      - name: Build the PDF
        id: pdf
        continue-on-error: true
        run: |
          export PATH="$(echo ~/.TinyTeX/bin/*):$PATH"
          python3 thesis/build.py
      - name: Keep LaTeX for next time (only once a PDF has been built with it)
        if: steps.tex.outputs.cache-hit != 'true' && steps.pdf.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-v2-${{ hashFiles('thesis/texlive-packages.txt') }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
